version: 1
language: go
policy:
  default:
    min: 25
  exclude:
    - ./cmd/scout/...
    - ./examples/...
  domains:
    - name: middleware
      match:
        - go.klarlabs.de/scout/middleware/...
      min: 75
    - name: cdp
      match:
        - go.klarlabs.de/scout/internal/cdp/...
      min: 68
    - name: launcher
      match:
        - go.klarlabs.de/scout/internal/launcher/...
      min: 50
    - name: wait
      match:
        - go.klarlabs.de/scout/internal/wait/...
      min: 70
    - name: agent
      match:
        - go.klarlabs.de/scout/agent/...
      min: 23
    - name: core
      match:
        - go.klarlabs.de/scout
      min: 20
    - name: cli
      match:
        - go.klarlabs.de/scout/cmd/scout/...
      min: 25
    - name: agui
      match:
        - go.klarlabs.de/scout/internal/agui/...
      min: 40
