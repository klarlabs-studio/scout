version: 2

project_name: scout

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/scout
    binary: scout
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

dockers_v2:
  - images:
      - "ghcr.io/klarlabs-studio/scout"
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      SCOUT_VERSION: "{{ .Version }}"
      SCOUT_COMMIT: "{{ .FullCommit }}"
    extra_files:
      - agent
      - cmd
      - internal
      - middleware
      - go.mod
      - go.sum
      - browse.go
      - context.go
      - engine.go
      - errors.go
      - group.go
      - keypress.go
      - lifecycle.go
      - middleware.go
      - options.go
      - page.go
      - page_fetch.go
      - recorder.go
      - selection.go
      - selection_all.go
      - table.go
      - urlvalidator.go
      - util.go
    labels:
      "org.opencontainers.image.source": "https://github.com/klarlabs-studio/scout"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "io.modelcontextprotocol.server.name": "io.github.klarlabs-studio/scout"
    dockerfile: Dockerfile

# The formula goes to the tap owned by the org that owns this repo, which is
# also the scope the org secret behind HOMEBREW_TAP_GITHUB_TOKEN can write to;
# a personal tap sits outside it and answers 403. scout.rb currently exists in
# BOTH taps, so whichever a user tapped first wins and the two drift apart —
# this makes the org copy the one that gets updated.
# homebrew_casks replaces brews (deprecated in GoReleaser v2.16). Homebrew's
# own guidance is that a cask, not a formula, is the right vehicle for a
# pre-compiled binary -- the formula path generated something that only
# pretended to build from source.
homebrew_casks:
    # The cask is scout-mcp, not scout: homebrew/cask already ships a
    # `scout` (Scout-App, a Sass processor), so `brew install --cask scout`
    # silently resolves to that one instead of this. As a formula the
    # clash produced a disambiguation warning; as a cask it just returns
    # the wrong product. The installed binary stays `scout` -- the
    # collision is in Homebrew's namespace, not on anyone's PATH.
    #
    # cask_renames.json in the tap carries existing `scout` installs over.
  - name: scout-mcp
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/klarlabs-studio/scout"
    description: "MCP server for AI-powered browser automation"
    license: "MIT"
    binaries:
      - scout
    hooks:
      post:
        # The release archives are not notarized, so Gatekeeper quarantines the
        # binary on first run. A formula was never subject to this; a cask is,
        # so without this scout refuses to start.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/scout"]
          end
