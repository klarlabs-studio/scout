# Thin caller for the shared klarlabs-studio Go CI bar.
# All gate logic (fmt, golangci-lint w/ gocritic, race tests, nox security
# scan + SARIF + baseline gate) lives in the reusable workflow — bump
# versions / add jobs there, once, org-wide.
#
# Chrome integration tests are intentionally NOT here: they need a browser
# and run ~5min, so they live in a dedicated workflow (integration.yml) and
# are excluded from the unit run via the `integration` build tag.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    # No paths-ignore here: branch protection requires this workflow's status
    # checks (ci / Lint, Test, Build, Security (nox)), and a docs-only PR that
    # skips the whole workflow never reports them — so the PR is unmergeable
    # forever without an admin override. Running CI on docs PRs is cheap (no
    # code changed → cache hits) and keeps them mergeable; the push trigger
    # above still skips docs, saving minutes on merges.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      # Enforce the checked-in .coverctl.yaml domain baselines.
      coverage: true
      # Scout has OS-specific browser/launcher behavior — validate the unit
      # suite on macOS + Windows on push-to-main.
      cross-platform: true

  ui:
    name: UI build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build
